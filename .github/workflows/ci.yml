name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TypeRacerServer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Core.Tests/Core.Tests.csproj
      - run: dotnet test Api.Tests/Api.Tests.csproj

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typeracer-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typeracer-client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [TypeRacerServer, typeracer-client]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
