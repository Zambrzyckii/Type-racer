# WebSocket upgrade handling for SignalR. `map` must live in the http context;
# the stock nginx.conf includes conf.d/*.conf there, so it is valid in this file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # React SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> ASP.NET Core ("backend" is the compose service name)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub: /gamehub/negotiate (HTTP) and the WebSocket upgrade share this prefix
    location /gamehub {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;   # Server-Sent Events fallback
        proxy_read_timeout 100s;  # idle WebSocket / long-poll; SignalR pings every 15s
    }
}
